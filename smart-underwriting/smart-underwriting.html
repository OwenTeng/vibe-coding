// --- 工具函数 ---
function getConclusionColor(conclusion) {
  if (!conclusion) return 'red';
  const c = conclusion.replace(/\s/g, '');
  if (c.includes('标准体') || c === '标体') return 'green';
  if (c.includes('除外') || c.includes('加费')) return 'yellow';
  if (c.includes('拒保')) return 'red';
  if (c.includes('转人工')) return 'orange';
  return 'red';
}

function getConclusionLabel(conclusion) {
  if (!conclusion) return '未知';
  const c = conclusion.replace(/\s/g, '');
  if (c.includes('标准体') || c === '标体') return '标准体承保';
  if (c.includes('加费除外')) return '加费除外承保';
  if (c.includes('加费')) return '加费承保';
  if (c.includes('除外')) return '除外承保';
  if (c.includes('拒保')) return '拒保';
  if (c.includes('转人工')) return '转人工核保';
  return conclusion;
}

function getConclusionCardClass(conclusion) {
  const color = getConclusionColor(conclusion);
  if (color === 'orange') return 'yellow';
  return color;
}

// --- 模糊匹配产品名 ---
function fuzzyMatchProduct(input) {
  const normalizedInput = input.replace(/\s/g, '').toLowerCase();
  let bestMatch = null;
  let bestScore = 0;

  for (const [productName, aliases] of Object.entries(PRODUCT_ALIASES)) {
    for (const alias of aliases) {
      const normalizedAlias = alias.replace(/\s/g, '').toLowerCase();
      if (normalizedInput.includes(normalizedAlias)) {
        const score = normalizedAlias.length / normalizedInput.length;
        if (score > bestScore) {
          bestScore = score;
          bestMatch = productName;
        }
      }
    }
  }
  return bestMatch;
}

// --- 从用户输入中提取疾病关键词 ---
// --- 父类-子类去重映射：如果已匹配到子类，则跳过父类 ---
const DISEASE_PARENT_MAP = {
  '结节': ['甲状腺结节', '乳腺结节', '肺结节'],
  '超声异常': [],
  '肿瘤标记物': [],
  '前列腺增生': ['前列腺钙化'],
};

function extractDiseases(input) {
  const found = [];
  const normalizedInput = input.replace(/\s/g, '');
  for (const [disease, keywords] of Object.entries(DISEASE_KEYWORDS)) {
    for (const kw of keywords) {
      if (normalizedInput.includes(kw.replace(/\s/g, ''))) {
        if (!found.includes(disease)) found.push(disease);
        break;
      }
    }
  }
  // 去重：如果已匹配到子类疾病，移除父类
  const toRemove = new Set();
  for (const [parent, children] of Object.entries(DISEASE_PARENT_MAP)) {
    if (found.includes(parent)) {
      const hasChild = children.some(c => found.includes(c));
      if (hasChild) toRemove.add(parent);
    }
  }
  return found.filter(d => !toRemove.has(d));
}

// --- 提取年龄 ---
function extractAge(input) {
  const match = input.match(/(\d+)\s*[岁年]/);
  return match ? parseInt(match[1]) : null;
}

// --- 获取产品树中某个疾病的第一个问题 ---
function getFirstQuestion(tree, disease) {
  if (!tree[disease]) return null;
  return tree[disease].questions[0];
}

// --- 获取所有产品中某个疾病的第一个问题（合并） ---
function getMergedFirstQuestion(disease) {
  const productIds = state.locked ? [state.confirmedProduct.id] : Object.keys(PRODUCT_TREES);
  const trees = productIds.map(id => ({ id, tree: PRODUCT_TREES[id] })).filter(p => p.tree[disease]);

  if (trees.length === 0) return null;

  // 如果只有一个产品有这个疾病，直接返回该产品的问题
  if (trees.length === 1) return { question: trees[0].tree[disease].questions[0], productIds: [trees[0].id] };

  // 多个产品都有这个疾病，比较第一个问题是否相同
  const firstQuestions = trees.map(t => t.tree[disease].questions[0]);
  const allSame = firstQuestions.every((q, i) => i === 0 || q.q === firstQuestions[0].q);

  if (allSame) {
    return { question: firstQuestions[0], productIds: trees.map(t => t.id) };
  }

  // 不同产品问题不同，需要分别展示或合并展示
  return { question: firstQuestions[0], productIds: trees.map(t => t.id), isDifferent: true, questions: firstQuestions };
}

// --- 沿着决策树前进 ---
function advanceInTree(tree, disease, answers) {
  let current = tree[disease].questions[0];
  for (const answer of answers) {
    if (current.branches && current.branches[answer]) {
      const next = current.branches[answer];
      if (next.result !== undefined) return next.result;
      if (next.branches) {
        // 找到下一个问题
        for (const key in next.branches) {
          if (typeof next.branches[key] === 'object' && next.branches[key].q) {
            current = next.branches[key];
            break;
          }
        }
      }
    }
  }
  return null; // 还需要继续问
}

// --- 获取决策树中下一个问题 ---
function getNextQuestion(tree, disease, answers) {
  let current = tree[disease].questions[0];
  for (let i = 0; i < answers.length; i++) {
    const answer = answers[i];
    if (current.branches && current.branches[answer]) {
      const next = current.branches[answer];
      if (next.result !== undefined) return { result: next.result, detail: next.detail };
      if (next.q) {
        current = next;
      } else if (next.branches) {
        // 找分支中的问题节点
        let found = false;
        for (const key in next.branches) {
          if (typeof next.branches[key] === 'object' && next.branches[key].q) {
            current = next.branches[key];
            found = true;
            break;
          }
        }
        if (!found) return { result: '拒保' }; // 没有更多问题，默认拒保
      }
    } else {
      // Fix 2: 尝试模糊匹配而非直接拒保
      let bestMatch = null;
      let bestScore = 0;
      const normalizedAnswer = answer.replace(/\s/g, '');
      for (const key in current.branches) {
        const normalizedKey = key.replace(/\s/g, '');
        if (normalizedKey === normalizedAnswer) {
          bestMatch = key;
          bestScore = 100;
          break;
        }
        if (normalizedKey.includes(normalizedAnswer) || normalizedAnswer.includes(normalizedKey)) {
          const score = Math.min(normalizedKey.length, normalizedAnswer.length);
          if (score > bestScore) {
            bestScore = score;
            bestMatch = key;
          }
        }
      }
      if (bestMatch && bestScore >= 2) {
        const next = current.branches[bestMatch];
        if (next.result !== undefined) return { result: next.result, detail: next.detail };
        if (next.q) { current = next; continue; }
      }
      return { result: 'DEFERRED' };
    }
  }
  return { question: current };
}

// --- 计算单个产品的核保结论 ---
function evaluateProduct(productId, disease, answers) {
  const tree = PRODUCT_TREES[productId];
  if (!tree || !tree[disease]) return { result: '标准体', detail: '该产品问卷未包含此疾病，默认标准体承保' };

  let current = tree[disease].questions[0];
  for (const answer of answers) {
    if (current.branches && current.branches[answer]) {
      const next = current.branches[answer];
      if (next.result !== undefined) return { result: next.result, detail: next.detail || '' };
      if (next.q) {
        current = next;
      } else if (next.branches) {
        let found = false;
        for (const key in next.branches) {
          if (typeof next.branches[key] === 'object' && next.branches[key].q) {
            current = next.branches[key];
            found = true;
            break;
          }
        }
        if (!found) return { result: '拒保', detail: '' };
      }
    } else {
      // Fix 2: 尝试找到最佳匹配的选项，而非直接拒保
      // 这处理了不同产品有不同问题结构的情况
      let bestMatch = null;
      let bestScore = 0;
      const normalizedAnswer = answer.replace(/\s/g, '');

      for (const key in current.branches) {
        const normalizedKey = key.replace(/\s/g, '');
        // 检查选项是否包含回答的关键部分
        if (normalizedKey === normalizedAnswer) {
          bestMatch = key;
          bestScore = 100;
          break;
        }
        if (normalizedKey.includes(normalizedAnswer) || normalizedAnswer.includes(normalizedKey)) {
          const score = Math.min(normalizedKey.length, normalizedAnswer.length);
          if (score > bestScore) {
            bestScore = score;
            bestMatch = key;
          }
        }
      }

      if (bestMatch && bestScore >= 2) {
        const next = current.branches[bestMatch];
        if (next.result !== undefined) return { result: next.result, detail: next.detail || '' };
        if (next.q) {
          current = next;
          continue;
        }
      }

      // 如果仍然无法匹配，返回deferred标记让调用者知道需要单独处理
      return { result: 'DEFERRED', detail: '该产品的问卷结构与当前回答不匹配' };
    }
  }
  return { result: null, detail: '' }; // 还需要继续问
}

// --- UI 函数 ---
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const statusBar = document.getElementById('statusBar');

function addMessage(type, content, options) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${type}`;

  const avatar = document.createElement('div');

  avatar.textContent = type === 'bot' ? '🛡️' : '👤';

}

  showTyping();

function handleOptionClick(option) {

    if (btn.textContent === option) btn.classList.add('selected');

// --- 主处理逻辑 ---
function processUserInput(text) {
  // 1. 如果正在等待产品确认
  if (state.pendingConfirm) {
    handleProductConfirmation(text);
    return;
  }

  // 2. 如果正在回答问题
  if (state.awaitingAnswer) {
    processOptionAnswer(text);
    return;
  }

  // 3. 检测是否包含产品名
  const matchedProduct = fuzzyMatchProduct(text);

  if (matchedProduct) {
    // 找到产品名，发起确认
    const product = PRODUCTS.find(p => p.name === matchedProduct);
    state.pendingConfirm = true;
    state.lockedProduct = product;

    addBotMessage(
      `<p>请问您想咨询的是 <strong>${product.fullName}</strong> 这款产品吗？</p>`,
      ['是，就咨询这款产品', '不是，我想咨询其他产品', '不针对具体产品，想对比所有产品']
    );
    updateStatus(`等待确认产品：${product.name}`);
    return;
  }

  // 4. 没有产品名，进行综合核保
  processGeneralInquiry(text);
}

function handleProductConfirmation(text) {
  state.pendingConfirm = false;

  if (text.includes('是') || text.includes('对') || text.includes('确认') || text.includes('咨询这款')) {
    state.locked = true;
    state.confirmedProduct = state.lockedProduct;
    addBotMessage(
      `<p>好的，已为您锁定 <strong>${state.confirmedProduct.fullName}</strong> 的智能核保问卷。</p>
       <p>请描述被保人的健康状况，我将为您进行核保评估。</p>
       <p style="color:var(--muted);font-size:13px">您可以告诉我：被保人的年龄、性别、以及具体的健康异常情况。</p>`
    );
    updateStatus(`已锁定：${state.confirmedProduct.name}`);
  } else if (text.includes('不针对') || text.includes('对比') || text.includes('所有产品') || text.includes('全部')) {
    state.locked = false;
    state.confirmedProduct = null;
    addBotMessage(
      `<p>好的，将为您进行五款产品的综合核保对比。</p>
       <p>请描述被保人的健康状况，我将综合所有产品的核保规则为您评估。</p>
       <p style="color:var(--muted);font-size:13px">您可以告诉我：被保人的年龄、性别、以及具体的健康异常情况。</p>`
    );
    updateStatus('综合核保模式 · 支持五款产品对比');
  } else {
    addBotMessage(
      `<p>好的，请您输入完整的产品名称，或不针对具体产品进行核保咨询。</p>
       <p>支持的产品：超玛13、小青龙6号、无敌宝宝2.0、复保明爱守护、海绵保宝</p>`
    );
    updateStatus('就绪 · 等待输入');
  }
}

function processGeneralInquiry(text) {
  // 提取疾病信息
  const diseases = extractDiseases(text);
  const age = extractAge(text);

  if (diseases.length === 0) {
    addBotMessage(
      `<p>抱歉，我暂时无法识别您描述的健康状况。</p>
       <p>请尝试更具体地描述，例如：</p>
       <div class="quick-actions">
         <button class="quick-btn" onclick="quickInput('我的客户38岁，有甲状腺结节')">甲状腺结节</button>
         <button class="quick-btn" onclick="quickInput('有乳腺结节，BI-RADS 3级')">乳腺结节</button>
         <button class="quick-btn" onclick="quickInput('有肺结节，5mm')">肺结节</button>
         <button class="quick-btn" onclick="quickInput('有高血压，服药控制中')">高血压</button>
         <button class="quick-btn" onclick="quickInput('乙肝小三阳')">乙肝</button>
         <button class="quick-btn" onclick="quickInput('有糖尿病')">糖尿病</button>
         <button class="quick-btn" onclick="quickInput('有子宫肌瘤')">子宫肌瘤</button>
         <button class="quick-btn" onclick="quickInput('有脂肪肝')">脂肪肝</button>
       </div>`
    );
    updateStatus('就绪 · 等待输入');
    return;
  }

  // 存储用户信息
  if (age) state.age = age;

  // 过滤掉已问过的疾病，将剩余疾病加入队列
  const newDiseases = diseases.filter(d => !state.collectedDiseases.has(d));
  if (newDiseases.length > 0) {
    state.diseaseQueue.push(...newDiseases);
  }

  if (state.diseaseQueue.length === 0) {
    addBotMessage(`<p>您提到的所有健康状况已经评估完毕。</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="quickInput('查看结果')">查看综合核保结论</button>
      </div>`);
    return;
  }

  if (newDiseases.length > 1) {
    // 用户同时提到多个疾病，告知将逐个问诊
    const diseaseList = newDiseases.map((d, i) => `<strong>${i + 1}. ${d}</strong>`).join('、');
    addBotMessage(
      `<p>检测到您提到了 ${newDiseases.length} 种健康状况：${diseaseList}</p>
       <p>我将逐个为您进行问诊评估，先从 <strong>${state.diseaseQueue[0]}</strong> 开始。</p>`
    );
  }

  // 如果当前没有在问诊中，立即开始队列中第一个疾病
  if (!state.awaitingAnswer) {
    startNextDiseaseInQueue();
  }
}

function startNextDiseaseInQueue() {
  // 从队列中取出下一个未问诊的疾病
  while (state.diseaseQueue.length > 0) {
    const next = state.diseaseQueue.shift();
    if (!state.collectedDiseases.has(next)) {
      startDiseaseInquiry(next);
      return;
    }
  }
  // 队列为空，所有疾病问诊完毕
  allDiseasesCompleted();
}

function startDiseaseInquiry(disease) {
  if (state.collectedDiseases.has(disease)) {
    // 已经问过这个疾病，跳到下一个
    addBotMessage(`<p>您之前已经提供了关于 <strong>${disease}</strong> 的信息。</p>`);
    return;
  }

  state.collectedDiseases.add(disease);
  state.currentDisease = disease;

  // 获取相关产品
  const productIds = state.locked ? [state.confirmedProduct.id] : Object.keys(PRODUCT_TREES);
  const relevantProducts = productIds.filter(id => PRODUCT_TREES[id][disease]);

  if (relevantProducts.length === 0) {
    // 所有产品都没有此疾病的核保规则，默认标体
    const productIds2 = state.locked ? [state.confirmedProduct.id] : Object.keys(PRODUCT_TREES);
    const defaultResults = {};
    for (const pid of productIds2) {
      defaultResults[pid] = { result: '标准体', detail: '该产品问卷未包含此疾病，默认标准体承保' };
    }
    state.allResults[disease] = defaultResults;
    state.conditions.push({ name: disease, answers: ['用户提及，问卷未覆盖'] });
    state.collectedDiseases.add(disease);
    addBotMessage(
      `<p>关于 <strong>${disease}</strong>：当前${state.locked ? '产品' : '五款产品'}的智核问卷中均未包含此疾病的专项问询，默认按标准体承保处理。</p>`
    );
    state.currentDisease = null;
    checkRemainingDiseases();
    return;
  }

  // 初始化该疾病的回答记录
  state.currentAnswers = [];
  state.currentChainIndex = 0;

  // 获取第一个问题
  const merged = getMergedFirstQuestion(disease);
  if (!merged) {
    addBotMessage(`<p>无法获取 <strong>${disease}</strong> 的核保问题。</p>`);
    return;
  }

  state.awaitingAnswer = true;
  state.currentQuestionNode = merged.question;

  const productNames = relevantProducts.map(id => PRODUCTS.find(p => p.id === id).name).join('、');
  addBotMessage(
    `<p>正在为您评估 <strong>${disease}</strong> 相关核保问题。</p>
     <p style="color:var(--muted);font-size:13px">涉及产品：${productNames}</p>
     <p><strong>${merged.question.q}</strong></p>`,
    merged.question.options
  );

  updateStatus(`正在问诊：${disease}`);
}

function processOptionAnswer(answer) {
  if (!state.currentDisease || !state.awaitingAnswer) {
    // 不在问答流程中，当做普通输入处理
    state.awaitingAnswer = false;
    processUserInput(answer);
    return;
  }

  // Fix 4: 检查用户输入是否为问题（而非回答）
  if (/[？?]/.test(answer) || /什么|怎么|为什么|吗|呢|如何|多少|哪|几/.test(answer)) {
    addBotMessage(
      `<p>您似乎在提问。当前我正在为您评估 <strong>${state.currentDisease}</strong>，请先回答以下问题：</p>
       <p><strong>${state.currentQuestionNode.q}</strong></p>`,
      state.currentQuestionNode.options
    );
    return;
  }

  // 检查用户输入是否匹配当前问题的选项
  if (state.currentQuestionNode && state.currentQuestionNode.options) {
    const options = state.currentQuestionNode.options;
    let matched = false;

    // Fix 1: 第一轮 - 精确匹配（优先用于按钮点击）
    let exactMatch = null;
    for (const opt of options) {
      const normalizedAnswer = answer.replace(/\s/g, '');
      const normalizedOpt = opt.replace(/\s/g, '');
      if (normalizedAnswer === normalizedOpt) {
        exactMatch = opt;
        break;
      }
    }

    if (exactMatch) {
      answer = exactMatch;
      matched = true;
    } else {
      // 第二轮 - 语义匹配（仅用于自由文本输入）
      // 修复后的语义关键词映射：避免交叉污染
      const semanticMap = {
        '是，已手术': ['已手术', '做了手术', '动过手术', '开过刀', '已经切除', '切除了', '已经做了'],
        '否，未手术': ['没手术', '没有手术', '未手术', '不做手术', '没做手术', '没开刀', '没有开刀', '保守治疗', '吃药', '观察', '没切除', '没有切除'],
        '是，良性': ['良性', '好的', '没事', '正常', '良性病变'],
        '否，恶性或未明确': ['恶性', '不好', '癌', '恶性肿瘤', '未明确', '不确定'],
        '是': ['是', '有', '对', '确认', '正确'],
        '否': ['否', '没有', '没', '未', '无', '不'],
        '1级': ['1级', '一级', '1类', '一类', 'TI-RADS1', 'TI-RADS 1', 'BI-RADS1', 'BI-RADS 1'],
        '2级': ['2级', '二级', '2类', '二类', 'TI-RADS2', 'TI-RADS 2', 'BI-RADS2', 'BI-RADS 2'],
        '3级': ['3级', '三级', '3类', '三类', 'TI-RADS3', 'TI-RADS 3', 'BI-RADS3', 'BI-RADS 3'],
        '4级及以上': ['4级', '四级', '4类', '四类', '5级', '五级', 'TI-RADS4', 'TI-RADS 4', 'TI-RADS5', 'TI-RADS 5', '4a', '4b', '4c', 'BI-RADS4', 'BI-RADS 4'],
        '标准体': ['标体', '标准体', '正常承保'],
        '转人工核保': ['转人工', '人工核保', '人工'],
        '拒保': ['拒保', '不保', '不能保'],
      };

      // 检查回答是否包含否定词（否/未/没/不），如果有，优先匹配含否定词的选项
      const hasNegation = /否|未|没|不/.test(answer);

      // 先尝试直接包含匹配
      for (const opt of options) {
        const normalizedAnswer = answer.replace(/\s/g, '');
        const normalizedOpt = opt.replace(/\s/g, '');
        if (normalizedAnswer.includes(normalizedOpt) || normalizedOpt.includes(normalizedAnswer)) {
          // 但要确保不会误匹配：如果答案含否定词，选项也必须含否定词
          if (hasNegation && !/否|未|没|不/.test(opt)) continue;
          matched = true;
          answer = opt;
          break;
        }
      }

      // 如果直接包含匹配失败，尝试语义关键词匹配
      if (!matched) {
        let bestMatch = null;
        let bestScore = 0;

        for (const opt of options) {
          let score = 0;
          const normalizedOpt = opt.replace(/\s/g, '');

          for (const [key, keywords] of Object.entries(semanticMap)) {
            if (normalizedOpt.includes(key.replace(/\s/g, ''))) {
              for (const kw of keywords) {
                if (answer.includes(kw)) {
                  // 更长的关键词匹配得分更高
                  const kwScore = kw.length;
                  if (kwScore > score) {
                    score = kwScore;
                    bestMatch = opt;
                  }
                }
              }
            }
          }
          bestScore = Math.max(bestScore, score);
        }

        if (bestMatch && bestScore >= 2) {
          answer = bestMatch;
          matched = true;
        }
      }

      // Fix 4: 如果仍然无法匹配，要求用户澄清而非自动选择
      if (!matched) {
        addBotMessage(
          `<p>抱歉，未能识别您的回答 "<strong>${escapeHtml(answer)}</strong>"。请从以下选项中选择一个：</p>
           <p><strong>${state.currentQuestionNode.q}</strong></p>`,
          options
        );
        return;
      }
    }
  }

  state.currentAnswers.push(answer);
  state.currentChainIndex++;

  const disease = state.currentDisease;
  const productIds = state.locked ? [state.confirmedProduct.id] : Object.keys(PRODUCT_TREES);

  // 检查各产品是否都已经有结论
  const results = {};
  let allDone = true;
  let nextQuestion = null;
  let nextQuestionProducts = [];
  let deferredProducts = []; // Fix 2: 需要单独处理的产品

  for (const pid of productIds) {
    const tree = PRODUCT_TREES[pid];
    if (!tree[disease]) continue;

    // 如果处于deferred模式，只评估deferred产品
    if (state.deferredProductIds && !state.deferredProductIds.includes(pid)) continue;

    const eval_ = evaluateProduct(pid, disease, state.currentAnswers);
    results[pid] = eval_;

    if (eval_.result === 'DEFERRED') {
      // Fix 2: 该产品的问题结构与当前回答不匹配，标记为延迟处理
      deferredProducts.push(pid);
      allDone = false;
    } else if (eval_.result === null) {
      allDone = false;
      if (!nextQuestion) {
        const nq = getNextQuestion(tree, disease, state.currentAnswers);
        if (nq.question) {
          nextQuestion = nq.question;
          nextQuestionProducts.push(pid);
        }
      } else {
        nextQuestionProducts.push(pid);
      }
    }
  }

  // Fix 2: 处理延迟的产品 - 为它们单独提问
  if (deferredProducts.length > 0 && !nextQuestion) {
    // 所有需要继续问的产品都是deferred的，需要重新开始问答
    // 保存已完成产品的结果，清空当前答案，为deferred产品重新问诊
    state.deferredResults = { ...results }; // 保存已有结果
    state.deferredProductIds = deferredProducts; // 记录待处理的deferred产品
    state.currentAnswers = []; // 清空答案，重新开始
    state.currentChainIndex = 0; // 重置轮数

    for (const pid of deferredProducts) {
      const tree = PRODUCT_TREES[pid];
      const firstQ = tree[disease].questions[0];
      if (firstQ && firstQ.q) {
        nextQuestion = firstQ;
        nextQuestionProducts.push(pid);
        break;
      }
    }

    // 提示用户即将为不同结构的产品重新问诊
    const deferredNames = deferredProducts.map(id => PRODUCTS.find(p => p.id === id).name).join('、');
    const doneNames = Object.keys(state.deferredResults).map(id => PRODUCTS.find(p => p.id === id).name).join('、');
    addBotMessage(
      `<p>✅ <strong>${doneNames}</strong> 已完成评估。</p>
       <p>接下来需要为 <strong>${deferredNames}</strong> 单独问诊（这些产品的问诊方式不同）。</p>`
    );
  }

  if (allDone) {
    // 所有产品都有结论了
    state.awaitingAnswer = false;

    // 合并deferred阶段之前已完成的产品结果
    if (state.deferredResults) {
      for (const [pid, res] of Object.entries(state.deferredResults)) {
        if (!results[pid] || results[pid].result === 'DEFERRED') {
          results[pid] = res;
        }
      }
      state.deferredResults = null;
      state.deferredProductIds = null;
    }

    state.allResults[disease] = results;

    // 保存条件
    state.conditions.push({
      name: disease,
      answers: [...state.currentAnswers]
    });

    // 展示结果
    showDiseaseResults(disease, results);

    // 检查是否还有未问的疾病
    state.currentDisease = null;
    checkRemainingDiseases();
  } else if (nextQuestion) {
    // 还有问题要问
    state.currentQuestionNode = nextQuestion;
    const remainingProductNames = nextQuestionProducts.map(id => PRODUCTS.find(p => p.id === id).name).join('、');

    addBotMessage(
      `<p><strong>${nextQuestion.q}</strong></p>
       <p style="color:var(--muted);font-size:13px">还需以下产品继续评估：${remainingProductNames}</p>`,
      nextQuestion.options
    );
    updateStatus(`继续问诊：${disease}（第${state.currentChainIndex + 1}轮）`);
  } else {
    // 没有更多问题但也没有结论（异常情况）
    state.awaitingAnswer = false;
    state.allResults[disease] = results;
    state.conditions.push({
      name: disease,
      answers: [...state.currentAnswers]
    });
    showDiseaseResults(disease, results);
    state.currentDisease = null;
    checkRemainingDiseases();
  }
}

function showDiseaseResults(disease, results) {
  let cardsHtml = '<div class="result-cards">';

  for (const pid of Object.keys(results)) {
    const product = PRODUCTS.find(p => p.id === pid);
    const r = results[pid];
    if (!r || !r.result || r.result === 'DEFERRED') continue;

    const cardClass = getConclusionCardClass(r.result);
    const label = getConclusionLabel(r.result);
    const detail = r.detail ? `<div class="detail">${r.detail}</div>` : '';

    cardsHtml += `
      <div class="result-card ${cardClass}">
        <div class="product-name">${product.fullName}</div>
        <span class="conclusion">${label}</span>
        ${detail}
      </div>`;
  }

  cardsHtml += '</div>';

  const completedCount = Object.keys(state.allResults).length;
  const remainingCount = state.diseaseQueue.filter(d => !state.collectedDiseases.has(d)).length;
  const progressInfo = remainingCount > 0
    ? `<p style="color:var(--muted);font-size:13px;margin-top:4px">📊 进度：已完成 ${completedCount} 项，剩余 ${remainingCount} 项待评估</p>`
    : '';

  addBotMessage(
    `<p>关于 <strong>${disease}</strong> 的核保结论如下：</p>${cardsHtml}
     ${progressInfo}`
  );
}

function checkRemainingDiseases() {
  // 检查队列中是否还有需要问诊的疾病
  const remainingInQueue = state.diseaseQueue.filter(d => !state.collectedDiseases.has(d));
  const completedCount = Object.keys(state.allResults).length;

  if (remainingInQueue.length > 0) {
    // 还有疾病需要问诊，自动开始下一个
    const remainingList = remainingInQueue.map(d => `<strong>${d}</strong>`).join('、');
    addBotMessage(
      `<p>✅ <strong>${state.conditions[state.conditions.length - 1].name}</strong> 评估完成（第 ${completedCount}/${completedCount + remainingInQueue.length} 项）</p>
       <p>接下来将继续评估：${remainingList}</p>`
    );
    // 短暂延迟后自动开始下一个疾病的问诊
    setTimeout(() => {
      startNextDiseaseInQueue();
    }, 800);
  } else {
    // 所有疾病问诊完毕，输出综合结论
    allDiseasesCompleted();
  }
}

function allDiseasesCompleted() {
  const completedCount = Object.keys(state.allResults).length;
  if (completedCount === 0) {
    updateStatus('就绪');
    return;
  }

  if (completedCount === 1) {
    // 只有一种体况，提示可以继续添加
    addBotMessage(
      `<p>您还可以继续描述其他健康状况，我将为您继续评估。</p>
       <div class="quick-actions">
         <button class="quick-btn" onclick="quickInput('查看结果')">查看综合核保结论</button>
         <button class="quick-btn" onclick="quickInput('还有高血压')">还有高血压</button>
         <button class="quick-btn" onclick="quickInput('还有脂肪肝')">还有脂肪肝</button>
         <button class="quick-btn" onclick="quickInput('还有乙肝')">还有乙肝</button>
       </div>`
    );
    updateStatus(`已完成 ${completedCount} 项评估 · 等待更多体况`);
  } else {
    // 多种体况全部完成，自动输出综合结论
    showAllResults();
  }
}

function showAllResults() {
  if (Object.keys(state.allResults).length === 0) {
    addBotMessage('<p>暂无核保结论，请先描述被保人的健康状况。</p>');
    return;
  }

  const productIds = state.locked ? [state.confirmedProduct.id] : Object.keys(PRODUCT_TREES);
  const diseaseNames = Object.keys(state.allResults);

  // 汇总每个产品的最终结论（取所有体况中最严重的结论）
  let summaryHtml = `<p>📋 综合所有体况（${diseaseNames.join('、')}）的核保结论汇总：</p><div class="result-cards">`;

  for (const pid of productIds) {
    const product = PRODUCTS.find(p => p.id === pid);
    let worstResult = '标准体';
    let details = [];

    for (const disease of diseaseNames) {
      const r = state.allResults[disease][pid];
      if (r && r.result) {
        details.push(`${disease}：${getConclusionLabel(r.result)}`);
        if (getResultSeverity(r.result) > getResultSeverity(worstResult)) {
          worstResult = r.result;
        }
      }
    }

    if (details.length === 0) {
      details.push('未涉及相关疾病');
    }

    const cardClass = getConclusionCardClass(worstResult);
    const label = getConclusionLabel(worstResult);

    summaryHtml += `
      <div class="result-card ${cardClass}">
        <div class="product-name">${product.fullName}</div>
        <span class="conclusion">${label}</span>
        <div class="detail">${details.join('；')}</div>
      </div>`;
  }

  summaryHtml += '</div>';

  // 找出结论最好的产品
  let bestProduct = null;
  let bestSeverity = 999;
  for (const pid of productIds) {
    let worst = '标准体';
    for (const disease of diseaseNames) {
      const r = state.allResults[disease][pid];
      if (r && r.result && getResultSeverity(r.result) > getResultSeverity(worst)) {
        worst = r.result;
      }
    }
    if (getResultSeverity(worst) < bestSeverity) {
      bestSeverity = getResultSeverity(worst);
      bestProduct = PRODUCTS.find(p => p.id === pid);
    }
  }

  if (bestProduct && diseaseNames.length > 1) {
    summaryHtml += `<p style="margin-top:10px;padding:10px;background:#ebf8ff;border-radius:8px;font-size:14px">
      💡 综合所有体况来看，<strong>${bestProduct.fullName}</strong> 的核保结论最为有利。
    </p>`;
  }

  summaryHtml += `<div class="quick-actions" style="margin-top:10px">
    <button class="quick-btn" onclick="quickInput('重新开始')">重新核保</button>
  </div>`;

  addBotMessage(summaryHtml);
  updateStatus('核保评估完成');
}

function getResultSeverity(result) {
  if (!result) return 0;
  const r = result.replace(/\s/g, '');
  if (r === 'DEFERRED') return -1; // Fix 2: 延迟处理的不计入严重度
  if (r.includes('标准体') || r === '标体') return 1;
  if (r.includes('加费除外')) return 4;
  if (r.includes('加费')) return 3;
  if (r.includes('除外')) return 2;
  if (r.includes('转人工')) return 5;
  if (r.includes('拒保')) return 6;
  return 0;
}

function quickInput(text) {
  userInput.value = text;
  sendMessage();
}

function resetChat() {
  state = {
    locked: false,
    lockedProduct: null,
    confirmedProduct: null,
    conditions: [],
    currentQuestionIndex: 0,
    pendingConfirm: false,
    allResults: {},
    chatHistory: [],
    questionQueue: [],
    currentDisease: null,
    currentQuestionChain: [],
    currentChainIndex: 0,
    awaitingAnswer: false,
    collectedDiseases: new Set(),
    finishedProducts: new Set(),
    diseaseQueue: []  // 待问诊疾病队列
  };
  chatContainer.innerHTML = '';
  initChat();
}

// --- 拦截"查看结果"等指令 ---
const originalProcessUserInput = processUserInput;
processUserInput = function(text) {
  if (text.includes('查看结果') || text.includes('查看所有') || text.includes('核保结论') || text.includes('汇总')) {
    state.awaitingAnswer = false;
    showAllResults();
    return;
  }
  if (text.includes('重新开始') || text.includes('重新核保')) {
    resetChat();
    return;
  }
  originalProcessUserInput(text);
};

// --- 初始化 ---
function initChat() {
  addBotMessage(
    `<p>您好！欢迎使用 <strong>智能核保系统</strong>，我可以根据被保人的健康状况，为您评估以下五款产品的核保结论：</p>
     <p>🔹 超玛13（小雨伞超级玛丽13号重疾险）</p>
     <p>🔹 小青龙6号（少儿重疾险）</p>
     <p>🔹 无敌宝宝2.0（人保寿险少儿重疾险）</p>
     <p>🔹 复保明爱守护</p>
     <p>🔹 海绵保宝</p>
     <p style="margin-top:8px">您可以：</p>
     <div class="quick-actions">
       <button class="quick-btn" onclick="quickInput('我的客户38岁，有甲状腺结节，什么产品可以标体投保？')">直接描述体况</button>
       <button class="quick-btn" onclick="quickInput('我想咨询超玛13')">指定产品咨询</button>
       <button class="quick-btn" onclick="quickInput('有乳腺结节，BI-RADS 3级')">乳腺结节咨询</button>
       <button class="quick-btn" onclick="quickInput('有肺结节5mm，未手术')">肺结节咨询</button>
     </div>
     <p style="color:var(--muted);font-size:13px;margin-top:8px">💡 您可以这么问：我的客户38岁，有甲状腺结节，什么产品可以标体投保？</p>`
  );
  updateStatus('就绪 · 支持自然语言输入');
}

// 自动调整textarea高度
userInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// 启动
initChat();
</script>
